<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>The Rail — Kitchen Ledger</title>

<!-- Add-to-home-screen behavior (iOS + Android) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="The Rail" />
<meta name="theme-color" content="#2E9E80" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />

<link rel="manifest" href="manifest.json" />

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --ink: #14151A;
    --muted: #6B7280;
    --line: rgba(20,21,26,0.14);
    --herb: #2E9E80;
    --herb-soft: rgba(46,158,128,0.12);
    --flame: #F0862F;
    --flame-soft: rgba(240,134,47,0.13);
    --pink: #E63F82;
    --yellow: #F5C93C;
    --steel: #14151A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .ticket { font-family: 'Manrope', sans-serif; font-weight: 700; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); color: var(--ink);
    padding: max(20px, env(safe-area-inset-top)) 16px 16px;
    border-bottom: 2px solid var(--ink);
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .header-brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; background: var(--herb);
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
    border: 1.5px solid var(--ink);
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.16em; opacity: 0.5; font-weight: 700; text-transform: uppercase; }
  h1 { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 21px; margin: 2px 0 0; line-height: 1.15; color: var(--ink); }
  .warn-banner {
    margin-top: 12px; display: flex; align-items: center; gap: 8px;
    background: var(--flame-soft); color: #B85A18; border: 1.5px solid var(--flame); border-radius: 10px;
    padding: 9px 12px; font-size: 12px; font-weight: 600;
  }
  nav {
    display: flex; gap: 8px; background: var(--bg); padding: 10px 16px;
    position: sticky; top: 78px; z-index: 15; border-bottom: 1px solid var(--line);
  }
  nav button {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 0; border: 1.5px solid var(--ink); background: var(--surface); border-radius: 999px;
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; color: var(--ink); cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  nav button.active { background: var(--herb); color: #fff; border-color: var(--ink); }
  main { padding: 16px; padding-bottom: 110px; max-width: 480px; margin: 0 auto; }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title { font-size: 17px; }
  .btn-add {
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; display: flex; align-items: center; gap: 4px;
    background: var(--herb); color: #fff; border: 1.5px solid var(--ink); border-radius: 999px;
    padding: 8px 13px; cursor: pointer;
  }
  .card { background: var(--surface); border-radius: 14px; border: 1.5px solid var(--line); box-shadow: 0 1px 2px rgba(20,21,26,0.04); margin-bottom: 10px; overflow: hidden; }
  .card-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
  .card-title { font-size: 14px; }
  .icon-btn { background: none; border: none; color: rgba(23,26,33,0.28); cursor: pointer; padding: 2px; }
  .icon-btn:hover { color: var(--flame); }
  .ledger-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 14px 12px; text-align: center; font-size: 10px; }
  .ledger-cell { display: flex; flex-direction: column; align-items: center; }
  .ledger-cell .label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; font-size: 9px; font-weight: 600; }
  .ledger-cell .value { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .ledger-cell .stepper { display: flex; gap: 4px; }
  .stepper button { width: 20px; height: 20px; border-radius: 5px; border: none; background: rgba(23,26,33,0.06); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; line-height: 1; }
  .end-cell { background: rgba(23,26,33,0.04); border-radius: 8px; padding: 6px 0; }
  .end-cell .unit { color: rgba(23,26,33,0.3); font-size: 9px; }
  .low-flag { background: var(--flame-soft); color: var(--flame); font-size: 10px; font-weight: 500; padding: 7px 14px; display: flex; align-items: center; gap: 6px; }
  .close-day-btn {
    width: 100%; margin-top: 16px; padding: 14px; border: 1.5px solid var(--ink); border-radius: 999px;
    background: var(--ink); color: #fff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
  summary { font-size: 12px; font-weight: 600; cursor: pointer; }
  .hist-row { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 40px 0; font-size: 12px; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; }
  .hint { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.5; }
  .hint .rust { color: var(--flame); font-weight: 600; }
  .recipe-list { font-size: 12px; color: var(--muted); margin: 8px 0 12px; padding-left: 0; list-style: none; }
  .recipe-list li.short { color: var(--flame); }
  .sold-count-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--herb-soft); border-radius: 10px; padding: 9px 12px; }
  .sold-count-label { font-size: 12px; color: var(--herb); font-weight: 600; }
  .sold-count-input {
    width: 64px; text-align: center; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 16px;
    border: 1.5px solid rgba(14,143,111,0.3); border-radius: 8px; padding: 6px 4px; background: #fff; outline: none;
    font-variant-numeric: tabular-nums;
  }
  .sold-count-input:focus { border-color: var(--herb); }
  .toast {
    position: fixed; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    z-index: 40; font-size: 13px; font-weight: 500; padding: 11px 18px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    color: #fff; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; transform: translate(-50%, 6px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.ok { background: var(--herb); }
  .toast.warn { background: var(--flame); }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,12,16,0.5); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal { background: var(--bg); width: 100%; max-width: 420px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { font-size: 18px; margin: 0; }
  .field { margin-bottom: 12px; }
  .field label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); display: block; margin-bottom: 5px; }
  .field input, .field select, .modal-input {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 11px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--herb); }
  .flex-row { display: flex; gap: 8px; }
  .flex-1 { flex: 1; }
  .w-90 { width: 90px; }
  .ingredient-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .add-row-btn { background: none; border: none; color: var(--herb); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; margin-bottom: 12px; padding: 0; }
  .save-btn { width: 100%; padding: 13px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--herb); color: #fff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .cancel-row { display: flex; gap: 8px; }
  .cancel-btn { flex: 1; padding: 13px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--surface); color: var(--ink); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .confirm-btn { flex: 1; padding: 13px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--flame); color: #fff; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; }
  .search-input {
    width: 100%; font-family: 'Inter', sans-serif; font-size: 14px; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 13px;
    outline: none; margin-bottom: 14px;
  }
  .search-input:focus { border-color: var(--herb); }
  .cat-group { margin-bottom: 4px; }
  .cat-header {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    background: none; border: none; padding: 6px 2px; margin-top: 12px; margin-bottom: 6px;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }
  .cat-count { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; text-transform: none; letter-spacing: 0; opacity: 0.7; }
  .card-title-btn {
    background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    color: var(--ink); font-size: inherit;
  }
  .card-title-btn:active { color: var(--herb); }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 4px; border-radius: 14px; border: 1px solid var(--line); }
  .ledger-table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 11px; min-width: 0; table-layout: fixed; }
  .ledger-table th {
    text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    font-size: 9px; color: var(--muted); padding: 9px 2px; border-bottom: 1px solid var(--line);
    background: rgba(23,26,33,0.02); position: sticky; top: 0;
  }
  .ledger-table th.th-name { text-align: left; padding-left: 10px; width: 30%; }
  .ledger-table th.th-num { width: 15%; }
  .ledger-table th.th-del { width: 22px; }
  .ledger-table td { padding: 6px 1px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; overflow: hidden; }
  .ledger-table td.td-name { text-align: left; padding-left: 10px; overflow: hidden; }
  .ledger-table tr.row-low td.td-end { color: var(--flame); font-weight: 700; }
  .ledger-table tr:last-child td { border-bottom: none; }
  .cell-input {
    width: 100%; max-width: 44px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; text-align: center;
    border: 1px solid transparent; border-radius: 6px; padding: 6px 0; background: transparent; outline: none;
    font-variant-numeric: tabular-nums;
  }
  .cell-input:focus { border-color: var(--herb); background: var(--herb-soft); }
  .name-input {
    width: 100%; min-width: 100px; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px;
    border: 1px solid transparent; border-radius: 6px; padding: 5px 6px; background: transparent; outline: none;
  }
  .name-input:focus { border-color: var(--herb); background: #fff; }
  .end-readout { font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }
  .table-unit { font-size: 8px; color: var(--muted); display: block; white-space: nowrap; }
  .item-name-txt { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cat-table-header td {
    background: rgba(23,26,33,0.03); font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 10px;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); cursor: pointer;
    padding: 8px 10px;
  }
  .row-del-btn { background: none; border: none; color: rgba(23,26,33,0.25); cursor: pointer; padding: 2px; font-size: 12px; }
  .row-del-btn:active { color: var(--flame); }
  .row-edit-btn { background: none; border: none; color: rgba(23,26,33,0.25); cursor: pointer; padding: 2px; font-size: 11px; flex-shrink: 0; }
  .row-edit-btn:active { color: var(--herb); }
  .name-cell-inner { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .name-cell-text { min-width: 0; overflow: hidden; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
  .stat-dot.dot-ok { background: var(--herb); }
  .stat-dot.dot-watch { background: var(--yellow); }
  .stat-dot.dot-low { background: var(--flame); box-shadow: 0 0 0 3px var(--flame-soft); }
  .resync-btn {
    width: 100%; margin-top: 8px; padding: 11px; border: 1.5px dashed var(--line); border-radius: 999px;
    background: none; color: var(--muted); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer;
  }
  .resync-btn:active { border-color: var(--herb); color: var(--herb); }
  .reset-btn {
    width: 100%; margin-top: 8px; padding: 11px; border: 1.5px dashed rgba(232,86,47,0.4); border-radius: 999px;
    background: none; color: var(--flame); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; cursor: pointer;
    opacity: 0.75;
  }
  .reset-btn:active { border-color: var(--flame); opacity: 1; }
  .kebab-btn {
    width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface);
    font-size: 18px; font-weight: 700; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center;
    line-height: 1; flex-shrink: 0;
  }
  .kebab-btn:active { background: var(--bg); }
  .settings-row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: none;
    padding: 13px 4px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-row .icon { font-size: 17px; width: 22px; text-align: center; flex-shrink: 0; }
  .settings-row .desc { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .settings-row.danger { color: var(--flame); }
  .settings-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 4px; }
  .settings-section-label:first-child { margin-top: 0; }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="header-brand">
      <div class="brand-mark">🐰</div>
      <div>
        <div class="eyebrow" id="eyebrow-label">DAILY LEDGER</div>
        <h1 id="today-label"></h1>
      </div>
    </div>
    <button class="kebab-btn" id="open-settings" aria-label="Settings">⋮</button>
  </div>
</header>

<nav>
  <button id="tab-ledger" class="active">📋 Ledger</button>
  <button id="tab-orders">🍳 Log Sales</button>
  <button id="tab-prep">🥣 Log Prod.</button>
</nav>

<main id="main"></main>

<div id="toast" class="toast"></div>
<div id="modal-root"></div>

<script>
/* ---------- State ---------- */
const UNITS = ["pcs","g","kg","ml","l","tbsp","tsp"];
const STORE_KEY = "kitchen_ledger_v1";
const ING_CATEGORIES = ["Produce","Dairy & Eggs","Meat & Seafood","Dry Goods","Beverages","Other"];
const PROD_CATEGORIES = ["Breakfast","Mains","Sides","Drinks","Other"];

const DEFAULT_STATE = {
  ingredients: [
    { id:"i1", name:"Eggs", unit:"pcs", start:20, production:4, sold:6, low:6, category:"Dairy & Eggs" },
    { id:"i2", name:"Butter", unit:"g", start:400, production:100, sold:40, low:100, category:"Dairy & Eggs" },
    { id:"i3", name:"Milk", unit:"ml", start:800, production:200, sold:200, low:200, category:"Dairy & Eggs" },
    { id:"i4", name:"Cheddar", unit:"g", start:250, production:50, sold:60, low:50, category:"Dairy & Eggs" },
    { id:"i5", name:"Flour", unit:"g", start:1800, production:0, sold:150, low:300, category:"Dry Goods" },
    { id:"i6", name:"Steak", unit:"g", start:3000, production:0, sold:800, low:500, category:"Meat & Seafood" }
  ],
  recipes: [
    { id:"r1", name:"Omelet", items:[{ing:"i1",amt:3},{ing:"i2",amt:10}], category:"Breakfast", soldCount:0 },
    { id:"r2", name:"Grilled Cheese", items:[{ing:"i4",amt:60},{ing:"i2",amt:15}], category:"Mains", soldCount:0 },
    { id:"r3", name:"Pancakes (stack)", items:[{ing:"i5",amt:150},{ing:"i1",amt:2},{ing:"i3",amt:200}], category:"Breakfast", soldCount:0 },
    { id:"r4", name:"Breakfast Steak", items:[{ing:"i1",amt:1},{ing:"i6",amt:100}], category:"Breakfast", soldCount:0 }
  ],
  history: [],
  settings: { businessName: "The Rail" }
};

let state = load();
let tab = "ledger";
let ledgerSearch = "";
let ordersSearch = "";
let prepSearch = "";
let collapsedCats = new Set(); // category names collapsed (shared across tabs by label reuse)

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // migrate: ensure category/soldCount/settings exist on all records
      parsed.ingredients = (parsed.ingredients||[]).map(i => ({ category:"Other", prepRecipe:[], ...i }));
      parsed.recipes = (parsed.recipes||[]).map(r => ({ category:"Other", soldCount:0, ...r }));
      parsed.settings = { businessName: "The Rail", ...(parsed.settings||{}) };
      if (!parsed.history) parsed.history = [];
      return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function round2(n){ return Math.round(n*100)/100; }
function endOf(ing){ return round2(ing.start + ing.production - ing.sold); }
function ingredientById(id){ return state.ingredients.find(i=>i.id===id); }
function availableOf(id){ const ing = ingredientById(id); return ing ? endOf(ing) : 0; }
function todayLabel(){
  return new Date().toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg, kind="ok"){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2400);
}

/* ---------- Actions ---------- */
function adjustField(id, field, delta){
  const ing = ingredientById(id);
  ing[field] = Math.max(0, round2(ing[field] + delta));
  save(); render();
}
function setFieldDirect(id, field, value){
  const ing = ingredientById(id);
  if (!ing) return;
  const n = parseFloat(value);
  ing[field] = isNaN(n) ? 0 : Math.max(0, round2(n));
  save(); render();
}
function deleteIngredient(id){
  state.ingredients = state.ingredients.filter(i=>i.id!==id);
  state.recipes = state.recipes.map(r=>({...r, items:r.items.filter(it=>it.ing!==id)}));
  save(); render();
}
function deleteRecipe(id){
  state.recipes = state.recipes.filter(r=>r.id!==id);
  save(); render();
}
function canFire(recipe, qty){
  qty = qty || 1;
  return recipe.items.every(it => availableOf(it.ing) >= it.amt * qty);
}
function setRecipeSoldCount(recipeId, newCount){
  const recipe = state.recipes.find(r=>r.id===recipeId);
  if (!recipe) return;
  newCount = Math.max(0, parseInt(newCount) || 0);
  const delta = newCount - recipe.soldCount;
  if (delta === 0) { render(); return; }
  if (delta > 0 && !canFire(recipe, delta)) {
    showToast(`Not enough left for ${newCount}x ${recipe.name}`, "warn");
    render();
    return;
  }
  recipe.items.forEach(it=>{
    const ing = ingredientById(it.ing);
    if (ing) ing.sold = Math.max(0, round2(ing.sold + it.amt * delta));
  });
  recipe.soldCount = newCount;
  save(); render();
  showToast(`Sold today: ${newCount}x ${recipe.name}`, "ok");
}
function updateBusinessName(name){
  state.settings.businessName = name.trim() || "The Rail";
  save(); render();
}
function exportBackup(){
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const dateStr = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `kitchen-ledger-backup-${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast("Backup downloaded", "ok");
  } catch(e) {
    showToast("Couldn't create backup", "warn");
  }
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.ingredients) || !Array.isArray(parsed.recipes)) {
        showToast("That file doesn't look like a valid backup", "warn");
        return;
      }
      parsed.ingredients = parsed.ingredients.map(i => ({ category:"Other", prepRecipe:[], ...i }));
      parsed.recipes = parsed.recipes.map(r => ({ category:"Other", soldCount:0, ...r }));
      parsed.settings = { businessName:"The Rail", ...(parsed.settings||{}) };
      if (!parsed.history) parsed.history = [];
      state = parsed;
      save(); render();
      closeModal();
      showToast("Backup restored", "ok");
    } catch(e) {
      showToast("Couldn't read that file", "warn");
    }
  };
  reader.readAsText(file);
}
function resyncSoldFromProducts(){
  // For every ingredient referenced by at least one product, recompute its
  // Sold total as the exact sum of (amount x sold-today) across all products
  // that use it. Ingredients not used by any product are left untouched,
  // since their Sold value may be tracked manually.
  const totals = {};
  const touched = new Set();
  state.recipes.forEach(r=>{
    r.items.forEach(it=>{
      touched.add(it.ing);
      totals[it.ing] = (totals[it.ing] || 0) + it.amt * r.soldCount;
    });
  });
  touched.forEach(ingId=>{
    const ing = ingredientById(ingId);
    if (ing) ing.sold = round2(totals[ingId]);
  });
  save(); render();
  showToast("Ingredient totals resynced from product counts", "ok");
}

function addIngredient(name, unit, start, low, category){
  state.ingredients.push({ id:uid("i"), name, unit, start, production:0, sold:0, low, category, prepRecipe:[] });
  save(); render();

function addPrepIngredient(name, unit, category, low, prepRecipe){

  save(); render();

function updateIngredient(id, name, unit, low, category, prepRecipe){
  const ing = ingredientById(id);
  if (!ing) return;
  ing.name = name; ing.unit = unit; ing.low = low; ing.category = category;
  if (prepRecipe !== undefined) ing.prepRecipe = prepRecipe;
  save(); render();
}
function canProduce(ing, qty){
  if (!ing.prepRecipe || ing.prepRecipe.length === 0) return true;
  return ing.prepRecipe.every(it => availableOf(it.ing) >= it.amt * qty);
}
function setProductionWithRecipe(ingId, newValue){
  const ing = ingredientById(ingId);
  if (!ing) return;
  newValue = Math.max(0, round2(parseFloat(newValue)) || 0);
  if (!ing.prepRecipe || ing.prepRecipe.length === 0) {
    ing.production = newValue;
    save(); render();
    return;
  }
  const delta = newValue - ing.production;
  if (delta === 0) { render(); return; }
  if (delta > 0 && !canProduce(ing, delta)) {
    showToast(`Not enough on hand to prep ${delta}x more ${ing.name}`, "warn");
    render();
    return;
  }
  ing.prepRecipe.forEach(it=>{
    const comp = ingredientById(it.ing);
    if (comp) comp.sold = Math.max(0, round2(comp.sold + it.amt * delta));
  });
  ing.production = newValue;
  save(); render();
  showToast(`Prepped ${newValue}x ${ing.name}`, "ok");
}
function addRecipe(name, items, category){
  state.recipes.push({ id:uid("r"), name, items, category });
  save(); render();
}
function updateRecipe(id, name, items, category){
  const r = state.recipes.find(r=>r.id===id);
  if (!r) return;
  r.name = name; r.items = items; r.category = category;
  save(); render();
}
function toggleCategory(cat){
  if (collapsedCats.has(cat)) collapsedCats.delete(cat); else collapsedCats.add(cat);
  render();
}
function groupByCategory(list, categories){
  const groups = {};
  categories.forEach(c => groups[c] = []);
  list.forEach(item => {
    const c = categories.includes(item.category) ? item.category : "Other";
    if (!groups[c]) groups[c] = [];
    groups[c].push(item);
  });
  return categories.filter(c => groups[c] && groups[c].length).map(c => [c, groups[c]]);
}

function attachHandlers(){
  document.querySelectorAll('[data-action="adjust"]').forEach(btn=>{
    btn.onclick = () => adjustField(btn.dataset.id, btn.dataset.field, parseFloat(btn.dataset.delta));
  });
  document.querySelectorAll('[data-action="cell-edit"]').forEach(inp=>{
    inp.onchange = () => {
      if (inp.dataset.field === "production") {
        setProductionWithRecipe(inp.dataset.id, inp.value);
      } else {
        setFieldDirect(inp.dataset.id, inp.dataset.field, inp.value);
      }
    };
    inp.onfocus = () => inp.select();
  });
  document.querySelectorAll('[data-action="delete-ing"]').forEach(btn=>{
    btn.onclick = () => deleteIngredient(btn.dataset.id);
  });
  document.querySelectorAll('[data-action="delete-recipe"]').forEach(btn=>{
    btn.onclick = () => deleteRecipe(btn.dataset.id);
  });
  document.querySelectorAll('[data-action="sold-count"]').forEach(inp=>{
    inp.onchange = () => setRecipeSoldCount(inp.dataset.id, inp.value);
    inp.onfocus = () => inp.select();
  });
  document.querySelectorAll('[data-action="edit-ing"]').forEach(btn=>{
    btn.onclick = () => openEditIngredientModal(btn.dataset.id);
  });
  document.querySelectorAll('[data-action="edit-recipe"]').forEach(btn=>{
    btn.onclick = () => openEditRecipeModal(btn.dataset.id);
  });
  document.querySelectorAll('[data-action="toggle-cat"]').forEach(btn=>{
    btn.onclick = () => toggleCategory(btn.dataset.cat);
  });
  const addIngBtn = document.querySelector('[data-action="open-add-ing"]');
  if (addIngBtn) addIngBtn.onclick = openAddIngredientModal;
  const addRecBtn = document.querySelector('[data-action="open-add-recipe"]');
  if (addRecBtn) addRecBtn.onclick = openAddRecipeModal;
  const closeBtn = document.querySelector('[data-action="confirm-close"]');
  if (closeBtn) closeBtn.onclick = openCloseDayModal;

  const ledgerSearchInput = document.getElementById("ledger-search");
  if (ledgerSearchInput) {
    ledgerSearchInput.oninput = () => { ledgerSearch = ledgerSearchInput.value; render(); refocusSearch("ledger-search"); };
  }
  const ordersSearchInput = document.getElementById("orders-search");
  if (ordersSearchInput) {
    ordersSearchInput.oninput = () => { ordersSearch = ordersSearchInput.value; render(); refocusSearch("orders-search"); };
  }
  const prepSearchInput = document.getElementById("prep-search");
  if (prepSearchInput) {
    prepSearchInput.oninput = () => { prepSearch = prepSearchInput.value; render(); refocusSearch("prep-search"); };
  }
  const addPrepBtn = document.querySelector('[data-action="open-add-prep"]');
  if (addPrepBtn) addPrepBtn.onclick = openAddPrepItemModal;
  document.querySelectorAll('[data-action="prep-count"]').forEach(inp=>{
    inp.onchange = () => setProductionWithRecipe(inp.dataset.id, inp.value);
    inp.onfocus = () => inp.select();
  });
}

        <p style="font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px;">
          This permanently deletes every ingredient, product, and past-day history you've entered, and restores the sample starter data. There's no undo.
        </p>
        <div class="field">
          <label>Type RESET to confirm</label>
          <input id="f-reset-confirm" placeholder="RESET" autocapitalize="characters" />
        </div>
        <div class="cancel-row">
          <button class="cancel-btn" id="cancel-reset">Cancel</button>
          <button class="confirm-btn" id="confirm-reset-btn" disabled style="opacity:0.4;">Reset everything</button>
        </div>
      </div>
    </div>`;
  document.getElementById("close-x").onclick = closeModal;
  document.getElementById("cancel-reset").onclick = closeModal;
  document.getElementById("backdrop").onclick = (e)=>{ if(e.target.id==="backdrop") closeModal(); };
  const input = document.getElementById("f-reset-confirm");
  const confirmBtn = document.getElementById("confirm-reset-btn");
  input.oninput = () => {
    const ok = input.value.trim().toUpperCase() === "RESET";
    confirmBtn.disabled = !ok;
    confirmBtn.style.opacity = ok ? "1" : "0.4";
  };
  confirmBtn.onclick = () => { if (!confirmBtn.disabled) resetAllData(); };
  input.focus();
}

function openAddPrepItemModal(){
  let rows = [{ing: state.ingredients[0]?.id || "", amt:""}];
  function rowsHtml(){
    if (state.ingredients.length === 0) return `<p style="font-size:11px;color:var(--muted);">Add at least one ingredient first (on the Ledger tab) before creating a prepped item.</p>`;
    return rows.map((row, idx)=>`
      <div class="ingredient-row">
        <select class="modal-input flex-1" data-prow="${idx}" data-prole="ing">
          ${state.ingredients.map(o=>`<option value="${o.id}" ${o.id===row.ing?"selected":""}>${esc(o.name)}</option>`).join("")}
        </select>
        <input class="modal-input w-90" type="number" placeholder="amt" data-prow="${idx}" data-prole="amt" value="${row.amt}" />

  function renderModal(){
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3 class="ticket">New prepped item</h3><button class="icon-btn" id="close-x">✕</button></div>
          <div class="field"><label>Name</label><input id="f-name" placeholder="e.g. Poached Egg" /></div>
          <div class="flex-row">
            <div class="field flex-1"><label>Unit</label>
              <select id="f-unit">${UNITS.map(u=>`<option value="${u}">${u}</option>`).join("")}</select>
            </div>
            <div class="field flex-1"><label>Category</label>
              <select id="f-cat">${ING_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
            </div>
          </div>
          <div class="field"><label>Reorder line (optional)</label><input id="f-low" type="number" placeholder="0" /></div>
          <div class="settings-section-label" style="margin-top:4px;">Made from</div>
          <p style="font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.5;">
            e.g. Poached Egg made from 1 Fresh Egg — logging how many you prepped will auto-deduct these.
          </p>
          <div id="prep-rows-wrap">${rowsHtml()}</div>
          ${state.ingredients.length ? `<button class="add-row-btn" id="add-prep-row">＋ Add component</button>` : ""}
          <button class="save-btn" id="save-prep">Add prepped item</button>
        </div>
      </div>`;
    document.getElementById("close-x").onclick = closeModal;
    document.getElementById("backdrop").onclick = (e)=>{ if(e.target.id==="backdrop") closeModal(); };
    document.querySelectorAll('[data-prole="ing"]').forEach(el=>{
      el.onchange = () => { rows[el.dataset.prow].ing = el.value; };
    });
    document.querySelectorAll('[data-prole="amt"]').forEach(el=>{
      el.oninput = () => { rows[el.dataset.prow].amt = el.value; };
    });
    document.querySelectorAll('[data-prole="remove"]').forEach(el=>{
      el.onclick = () => { rows.splice(+el.dataset.prow,1); renderModal(); };
    });
    const addRowBtn = document.getElementById("add-prep-row");
    if (addRowBtn) addRowBtn.onclick = () => { rows.push({ing: state.ingredients[0]?.id||"", amt:""}); renderModal(); };
    document.getElementById("save-prep").onclick = () => {
      const name = document.getElementById("f-name").value.trim();
      const unit = document.getElementById("f-unit").value;
      const cat = document.getElementById("f-cat").value;
      const low = document.getElementById("f-low").value;
      const clean = rows.filter(r=>r.ing && r.amt !== "" && +r.amt > 0).map(r=>({ing:r.ing, amt:+r.amt}));
      if (!name) return;
      addPrepIngredient(name, unit, cat, low===""?0:+low, clean);
      closeModal();
    };
    document.getElementById("f-name").focus();
  }
  renderModal();
}

  if (!ing) return;

  const otherIngs = state.ingredients.filter(i=>i.id !== id);

  function prepRowsHtml(){
    if (otherIngs.length === 0) return `<p style="font-size:11px;color:var(--muted);">Add at least one other ingredient first to define what this is made from.</p>`;
    return prepRows.map((row, idx)=>`
      <div class="ingredient-row">
        <select class="modal-input flex-1" data-prow="${idx}" data-prole="ing">
          ${otherIngs.map(o=>`<option value="${o.id}" ${o.id===row.ing?"selected":""}>${esc(o.name)}</option>`).join("")}
        </select>
        <input class="modal-input w-90" type="number" placeholder="amt" data-prow="${idx}" data-prole="amt" value="${row.amt}" />
        <button class="icon-btn" data-prow="${idx}" data-prole="remove">✕</button>
      </div>`).join("");
  }

  function renderModal(){
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3 class="ticket">Edit ingredient</h3><button class="icon-btn" id="close-x">✕</button></div>
          <div class="field"><label>Name</label><input id="f-name" value="${esc(ing.name)}" /></div>
          <div class="field"><label>Unit</label>
            <select id="f-unit">${UNITS.map(u=>`<option value="${u}" ${u===ing.unit?"selected":""}>${u}</option>`).join("")}</select>
          </div>
          <div class="field"><label>Category</label>
            <select id="f-cat">${ING_CATEGORIES.map(c=>`<option value="${c}" ${c===ing.category?"selected":""}>${c}</option>`).join("")}</select>
          </div>
          <div class="field"><label>Reorder line</label><input id="f-low" type="number" value="${ing.low}" /></div>
          <p style="font-size:11px;color:var(--muted);margin:-4px 0 14px;">Start/Sold aren't edited here — use the ledger table directly.</p>

          <div class="settings-section-label" style="margin-top:4px;">Made from (optional)</div>
          <p style="font-size:11px;color:var(--muted);margin:0 0 10px;line-height:1.5;">
            If this item is prepped from other ingredients (e.g. Poached Egg is made from Fresh Egg), list them here. Logging Production for this item will auto-deduct these from Sold on the components.
          </p>
          <div id="prep-rows-wrap">${prepRowsHtml()}</div>
          ${otherIngs.length ? `<button class="add-row-btn" id="add-prep-row">＋ Add component</button>` : ""}

    });

      el.oninput = () => { prepRows[el.dataset.prow].amt = el.value; };
    });
    document.querySelectorAll('[data-prole="remove"]').forEach(el=>{
      el.onclick = () => { prepRows.splice(+el.dataset.prow,1); renderModal(); };
    });
    const addRowBtn = document.getElementById("add-prep-row");
    if (addRowBtn) addRowBtn.onclick = () => { prepRows.push({ing: otherIngs[0]?.id||"", amt:""}); renderModal(); };
    document.getElementById("save-ing").onclick = () => {
      const name = document.getElementById("f-name").value.trim();
      const unit = document.getElementById("f-unit").value;
      const cat = document.getElementById("f-cat").value;
      const low = document.getElementById("f-low").value;
      if (!name) return;
      const cleanPrep = prepRows.filter(r=>r.ing && r.amt !== "" && +r.amt > 0).map(r=>({ing:r.ing, amt:+r.amt}));
      updateIngredient(id, name, unit, low===""?0:+low, cat, cleanPrep);

function openAddRecipeModal(){
  buildRecipeModal(null, "New product", "Save product", (name, items, cat) => addRecipe(name, items, cat));
}
function openEditRecipeModal(id){
  const r = state.recipes.find(r=>r.id===id);
  if (!r) return;
  buildRecipeModal(r, "Edit product", "Save changes", (name, items, cat) => updateRecipe(id, name, items, cat));

function buildRecipeModal(existing, title, saveLabel, onSave){
  let rows = existing ? existing.items.map(it=>({ing:it.ing, amt:String(it.amt)})) : [{ing: state.ingredients[0]?.id || "", amt:""}];
  function rowsHtml(){
    return rows.map((row, idx)=>`
      <div class="ingredient-row">
        <select class="modal-input flex-1" data-row="${idx}" data-role="ing">
          ${state.ingredients.map(ing=>`<option value="${ing.id}" ${ing.id===row.ing?"selected":""}>${esc(ing.name)}</option>`).join("")}
        </select>
        <input class="modal-input w-90" type="number" placeholder="amt" data-row="${idx}" data-role="amt" value="${row.amt}" />
        <button class="icon-btn" data-row="${idx}" data-role="remove">✕</button>
      </div>`).join("");
  }
  function renderModal(){
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-backdrop" id="backdrop">
        <div class="modal">
          <div class="modal-head"><h3 class="ticket">${title}</h3><button class="icon-btn" id="close-x">✕</button></div>
          <div class="field"><label>Product name</label><input id="f-name" placeholder="e.g. Breakfast Steak" value="${existing?esc(existing.name):''}" /></div>
          <div class="field"><label>Category</label>
            <select id="f-cat">${PROD_CATEGORIES.map(c=>`<option value="${c}" ${existing&&existing.category===c?"selected":""}>${c}</option>`).join("")}</select>
          </div>
          <div style="font-size:12px;color:rgba(43,38,32,0.5);margin:4px 0 8px;">Consumes per order</div>
          <div id="rows-wrap">${rowsHtml()}</div>
          <button class="add-row-btn" id="add-row">＋ Add ingredient</button>
          <button class="save-btn" id="save-recipe">${saveLabel}</button>
        </div>
      </div>`;
    document.getElementById("close-x").onclick = closeModal;
    document.getElementById("backdrop").onclick = (e)=>{ if(e.target.id==="backdrop") closeModal(); };
    document.querySelectorAll('[data-role="ing"]').forEach(el=>{
      el.onchange = () => { rows[el.dataset.row].ing = el.value; };
    });
    document.querySelectorAll('[data-role="amt"]').forEach(el=>{
      el.oninput = () => { rows[el.dataset.row].amt = el.value; };
    });
    document.querySelectorAll('[data-role="remove"]').forEach(el=>{
      el.onclick = () => { rows.splice(+el.dataset.row,1); renderModal(); };
    });
    document.getElementById("add-row").onclick = () => { rows.push({ing: state.ingredients[0]?.id||"", amt:""}); renderModal(); };
    document.getElementById("save-recipe").onclick = () => {
      const name = document.getElementById("f-name").value.trim();
      const cat = document.getElementById("f-cat").value;
      const clean = rows.filter(r=>r.ing && r.amt !== "" && +r.amt > 0).map(r=>({ing:r.ing, amt:+r.amt}));
      if (!name || clean.length === 0) return;
      onSave(name, clean, cat);
      closeModal();
    };
    document.getElementById("f-name").focus();
  }
  renderModal();
}
